<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nome do perfil · Forja</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="css/style.css">
<script>try{if(localStorage.getItem('forja-logado')==='1')document.documentElement.classList.add('logado')}catch(e){}</script>
</head>
<body>
<div class="app ">
<main class="auth">
  <a class="logo logo--grande" href="index.html" aria-label="Voltar ao início"></a>
  <h1>Nome do perfil</h1>
  <form data-destino="home.html" data-logar novalidate>
    <div class="foto-perfil-editar">
      <div class="avatar-padrao"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="38" r="20" fill="#a6d1fb"/><path d="M14 100c0-22 16-34 36-34s36 12 36 34z" fill="#a6d1fb"/></svg></div>
      <label for="foto" aria-label="Alterar foto"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z" fill="#fff"/></svg></label>
      <input id="foto" class="sr-only" type="file" accept="image/*">
    </div>
    <div class="campo"><input type="text" placeholder="Nome" aria-label="Nome" required></div>
    <div class="campo"><input type="text" placeholder="Nome do Usuário" aria-label="Nome do Usuário" required></div>
    <button class="btn btn--retangulo" type="submit" style="margin-top:19px">Finalizar</button>
  </form>
</main>
</div>
<script src="js/main.js"></script>
</body>
</html>
